name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (GCC, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configuration
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DODYSSEE_SANITIZERS=ON

      - name: Compilation
        run: cmake --build build -j

      - name: Tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Le client raylib est un outil de debug Linux : sous Windows, on vérifie shared/, le serveur
      # (utilisé en solo) et les tests, c'est-à-dire tout ce que le plugin Unreal réutilisera.
      - name: Configuration
        run: cmake -S . -B build -DODYSSEE_BUILD_CLIENT=OFF

      - name: Compilation
        run: cmake --build build --config Debug -j

      - name: Tests
        run: ctest --test-dir build -C Debug --output-on-failure
