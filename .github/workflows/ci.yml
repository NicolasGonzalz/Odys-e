name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (GCC, sanitizers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # une CI bloquée échoue vite au lieu d'occuper un runner des heures
    steps:
      - uses: actions/checkout@v7

      # Les miroirs Ubuntu de GitHub ont déjà bloqué cette étape 23 min : délai court et
      # nouvelles tentatives, pour échouer vite (ou réussir au 2e essai) plutôt que d'attendre.
      - name: Dépendances système
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configuration
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DODYSSEE_SANITIZERS=ON

      - name: Compilation
        run: cmake --build build -j

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      # Le plugin Unreal n'est pas compilé en CI (ADR 0003) : on vérifie au moins qu'il embarque
      # bien tous les fichiers de shared/src (un oubli ne se verrait qu'à l'édition de liens).
      - name: Sources de shared/ dans le plugin OdysseeNet
        run: python3 scripts/odysseenet_sources.py

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Le client raylib est un outil de debug Linux : sous Windows, on vérifie shared/, le serveur
      # (utilisé en solo) et les tests, c'est-à-dire tout ce que le plugin Unreal réutilisera.
      - name: Configuration
        run: cmake -S . -B build -DODYSSEE_BUILD_CLIENT=OFF -DODYSSEE_WARNINGS_AS_ERRORS=ON

      - name: Compilation
        run: cmake --build build --config Debug -j

      - name: Tests
        run: ctest --test-dir build -C Debug --output-on-failure
